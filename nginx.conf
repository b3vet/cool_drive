# CoolDrive nginx site config (used by the Dockerfile / Coolify deploy).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # nginx serves HTTP Range automatically -> MP3 seeking/streaming works.
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # 3D models (.glb): set the MIME type + cache them
  location ~* \.(glb|gltf)$ {
    default_type model/gltf-binary;
    add_header Cache-Control "public, max-age=604800";
  }

  # audio + images: long cache (also lets a CDN cache them if you add one later)
  location ~* \.(mp3|ogg|wav|m4a|png|jpe?g|svg|ico)$ {
    add_header Cache-Control "public, max-age=604800";
  }

  # web app manifest
  location ~* \.webmanifest$ {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }

  # service worker must never be cached by the browser
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  # code + markup: always revalidate so updates show immediately
  location ~* \.(html|js|mjs|json|css)$ {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
